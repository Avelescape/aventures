<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Le disque des artefacts</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap");
    :root{--fond-principal:#0E2228;--fond-panneau:#132F35;--or-patine:#B78B45;--cuivre:#E28A50;--ivoire:#E9DDC7;--beige-grise:#DED1BC;--ombre:#071417;--turquoise:#35D3D0;--ink:#09292c}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--fond-principal);color:var(--ivoire);font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;overflow-x:hidden}
    body{display:grid;place-items:start center;overscroll-behavior:none;background:radial-gradient(circle at 50% 0%,rgba(23,107,112,.14),transparent 42%),linear-gradient(180deg,var(--fond-principal),var(--ombre))}
    .game{position:relative;width:min(100vw,576px);aspect-ratio:1152/2048;overflow:hidden;background:var(--fond-principal);touch-action:none;user-select:none}
    .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
    .instructions{position:absolute;z-index:20;top:calc(env(safe-area-inset-top) + 1.2%);left:5%;right:5%;margin:0;color:var(--ivoire);text-align:center;font-weight:700;font-size:clamp(19px,4.2vw,26px);text-shadow:0 2px 5px #000,0 0 12px #000}
    .tray{position:absolute;z-index:25;top:6.2%;left:3%;right:3%;display:flex;justify-content:space-around;gap:2%;padding:2.3% 2%;border:2px solid var(--or-patine);border-radius:18px;background:linear-gradient(145deg,rgba(19,47,53,.97),rgba(14,34,40,.97));box-shadow:0 7px 25px #0008}
    .artifact{width:21%;aspect-ratio:1;border:1px solid rgba(183,139,69,.72);border-radius:50%;padding:0;background:var(--fond-panneau);overflow:hidden;cursor:grab;touch-action:none;box-shadow:0 3px 9px #000b;transition:opacity .25s,transform .2s,border-color .2s}
    .artifact img,.placed img{width:100%;height:100%;object-fit:cover;pointer-events:none}
    .artifact.used{opacity:.18;pointer-events:none;transform:scale(.82)}
    .disk{position:absolute;z-index:10;left:calc(52.55% + 1mm);top:66.35%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;will-change:transform,filter}
    .disk-face{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;pointer-events:none}
    .slot{position:absolute;width:25.5%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
    .slot[data-slot="couronne"]{left:25.1%;top:25.5%}.slot[data-slot="hermine"]{left:74.9%;top:25.5%}
    .slot[data-slot="triskel"]{left:25.1%;top:74.7%}.slot[data-slot="cle"]{left:74.9%;top:74.7%}
    .slot.correct{box-shadow:none;filter:none}
    .placed{position:absolute;inset:-2%;border-radius:50%;overflow:hidden;animation:snap .3s cubic-bezier(.2,1.6,.4,1)}
    .drag-copy{position:fixed;z-index:1000;width:84px;height:84px;border-radius:50%;overflow:hidden;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);filter:drop-shadow(0 8px 9px #000b)}
    .drag-copy img{width:100%;height:100%;object-fit:cover}
    .disk.unscrew{animation:unscrew 5s linear forwards}
    .continue-button{position:absolute;z-index:40;left:50%;bottom:8%;transform:translateX(-50%);width:min(82%,360px);padding:15px 22px;border:2px solid var(--or-patine);border-radius:999px;background:rgba(19,47,53,.95);color:var(--ivoire);font:600 clamp(21px,4.7vw,26px)/1.2 "Cormorant Garamond",Georgia,serif;text-align:center;text-decoration:none;box-shadow:0 5px 16px rgba(7,20,23,.55);opacity:0;pointer-events:none;transition:opacity .45s ease,transform .45s ease,background .16s ease}
    .continue-button.visible{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
    .continue-button:active{transform:translateX(-50%) scale(.97);background:var(--cuivre)}
    .game.wrong{animation:wrong .22s linear 2}
    @keyframes snap{from{transform:scale(.55);opacity:.3}to{transform:scale(1);opacity:1}}
    @keyframes unscrew{
      0%{transform:translate(-50%,-50%) rotate(0) scale(1);filter:none}
      10%{transform:translate(-50.3%,-50%) rotate(-9deg) scale(1.003)}
      15%{transform:translate(-49.8%,-50.2%) rotate(-7deg) scale(1.003)}
      29%{transform:translate(-50.25%,-49.9%) rotate(-25deg) scale(1.012)}
      34%{transform:translate(-49.85%,-50.15%) rotate(-22deg) scale(1.012)}
      49%{transform:translate(-50.2%,-50%) rotate(-43deg) scale(1.025)}
      54%{transform:translate(-49.85%,-50.2%) rotate(-40deg) scale(1.025)}
      70%{transform:translate(-50.15%,-50%) rotate(-65deg) scale(1.045)}
      75%{transform:translate(-49.9%,-50.15%) rotate(-62deg) scale(1.045)}
      88%{transform:translate(-50%,-56%) rotate(-90deg) scale(1.09);opacity:1;filter:drop-shadow(0 10px 18px #000)}
      93%{transform:translate(-50%,-76%) rotate(-90deg) scale(1.16);opacity:1}
      100%{transform:translate(-50%,145vh) rotate(-90deg) scale(.78);opacity:0}
    }
    @keyframes wrong{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
    @media (max-width:576px){.instructions{top:calc(env(safe-area-inset-top) + 1%);left:4%;right:4%;line-height:1.08}.tray{top:10.5%}}
    @media (min-width:577px){.game{margin-block:16px;border-radius:24px;box-shadow:0 14px 60px #000b}.drag-copy{width:102px;height:102px}}
    @media (prefers-reduced-motion:reduce){.disk.unscrew{animation-duration:1.1s}}
  </style>
</head>
<body>
  <main class="game" id="game" aria-label="Placez les quatre artefacts sur le disque">
    <img class="scene" src="images/3-webpstatueouverte.webp" alt="Statue du roi Gradlon">
    <p class="instructions" id="instructions">Faites glisser chaque artefact sur le bon logement</p>
    <section class="tray" aria-label="Artefacts">
      <button class="artifact" data-artifact="cle" aria-label="La Clé"><img src="images/3-webp1.webp" alt=""></button>
      <button class="artifact" data-artifact="couronne" aria-label="La Couronne"><img src="images/3-webp2.webp" alt=""></button>
      <button class="artifact" data-artifact="triskel" aria-label="Le Triskel"><img src="images/3-webP3.webp" alt=""></button>
      <button class="artifact" data-artifact="hermine" aria-label="L’Hermine"><img src="images/3-webp4.webp" alt=""></button>
    </section>
    <div class="disk" id="disk">
      <img class="disk-face" src="images/3-webpdisquevide.webp" alt="Disque à quatre logements">
      <div class="slot" data-slot="couronne"></div>
      <div class="slot" data-slot="hermine"></div>
      <div class="slot" data-slot="triskel"></div>
      <div class="slot" data-slot="cle"></div>
    </div>
    <!-- Emplacement sonore : ajoutez sons/grincement.mp3 dans votre dossier. -->
    <audio id="stoneSound" preload="auto" playsinline src="sons/grincement.mp3"></audio>
    <a class="continue-button" id="descendreEchelle" href="../index.html?scene=echelle#echelle" hidden>
      Approcher
    </a>
  </main>
  <script>
    const game=document.querySelector('#game'),disk=document.querySelector('#disk');
    const instructions=document.querySelector('#instructions');
    const descendreEchelle=document.querySelector('#descendreEchelle');
    const slots=[...document.querySelectorAll('.slot')];
    let placed=0,drag=null;
    const stoneSound=document.querySelector('#stoneSound');
    function deverrouillerSonPierre(){
      const ancienVolume=stoneSound.volume; stoneSound.volume=0;
      const essai=stoneSound.play();
      if(essai&&typeof essai.then==='function'){essai.then(()=>{stoneSound.pause();stoneSound.currentTime=0;stoneSound.volume=ancienVolume;}).catch(()=>{stoneSound.volume=ancienVolume;});}
      else{stoneSound.pause();stoneSound.currentTime=0;stoneSound.volume=ancienVolume;}
    }
    document.addEventListener('touchstart',deverrouillerSonPierre,{once:true,passive:true});
    document.addEventListener('pointerdown',deverrouillerSonPierre,{once:true,passive:true});

    document.querySelectorAll('.artifact').forEach(button=>button.addEventListener('pointerdown',e=>{
      if(button.classList.contains('used'))return;
      e.preventDefault();button.setPointerCapture(e.pointerId);
      const copy=document.createElement('div');copy.className='drag-copy';copy.innerHTML=button.innerHTML;document.body.append(copy);
      drag={button,copy,id:e.pointerId,type:button.dataset.artifact};move(e);
    }));
    addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id)move(e)},{passive:false});
    addEventListener('pointerup',drop);addEventListener('pointercancel',drop);
    function move(e){e.preventDefault();drag.copy.style.left=e.clientX+'px';drag.copy.style.top=e.clientY+'px'}
    function drop(e){
      if(!drag||e.pointerId!==drag.id)return;
      const {button,copy,type}=drag;drag=null;
      const match=slots.find(s=>s.dataset.slot===type),r=match.getBoundingClientRect();
      const distance=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));
      copy.remove();
      if(distance<Math.max(r.width*.95,44))place(button,match);else{game.classList.add('wrong');setTimeout(()=>game.classList.remove('wrong'),500)}
    }
    function place(button,slot){
      button.classList.add('used');slot.classList.add('correct');
      const item=document.createElement('div');item.className='placed';item.innerHTML=button.innerHTML;slot.append(item);
      placed++;if(navigator.vibrate)navigator.vibrate(35);
      if(placed===4)setTimeout(finish,850)
    }
    function finish(){
      instructions.textContent='Le mécanisme se met en mouvement…';game.classList.add('completed');
      stoneSound.currentTime=0;
      stoneSound.play().catch(()=>{});
      if(navigator.vibrate)navigator.vibrate([60,45,90,45,140]);
      setTimeout(()=>disk.classList.add('unscrew'),420);
      setTimeout(()=>{
        instructions.textContent='Le passage est ouvert !';
        descendreEchelle.hidden=false;
        requestAnimationFrame(()=>descendreEchelle.classList.add('visible'));
        game.dispatchEvent(new CustomEvent('disqueOuvert',{bubbles:true}));
      },5650)
    }
  </script>
</body>
</html>
