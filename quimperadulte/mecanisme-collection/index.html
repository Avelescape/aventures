<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17252c">
  <title>Artefact découvert — Le disque de schiste</title>

  <style>
    :root {
      --ivoire: #e3d9ca;
      --pierre: #c8bbaa;
      --ardoise: #586b7b;
      --charpente: #344753;
      --nuit: #17252c;
      --charbon: #1b2022;
      --gris-pierre: #756f68;
      --cuivre: #a85f3d;
      --brume: #91a0a8;
      --duree-entree: 1100ms;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--nuit);
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      color: var(--ivoire);
    }

    button { font: inherit; }

    .decouverte {
      position: relative;
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(155deg, rgba(88,107,123,.32) 0%, transparent 42%),
        linear-gradient(25deg, #344753 0%, var(--nuit) 56%, var(--charbon) 100%);
    }

    .decouverte::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      opacity: .28;
      background-image:
        repeating-linear-gradient(23deg, transparent 0 7px, rgba(255,255,255,.025) 8px 9px),
        repeating-radial-gradient(circle at 30% 20%, transparent 0 9px, rgba(0,0,0,.2) 10px 11px);
    }

    .scene {
      min-height: 0;
      display: grid;
      place-items: center;
      align-content: center;
      padding: max(24px, env(safe-area-inset-top)) 18px 20px;
      text-align: center;
    }

    .surtitre {
      margin: 0 0 5px;
      color: var(--pierre);
      font-family: Inter, Arial, sans-serif;
      font-size: clamp(.72rem, 2.8vw, .86rem);
      font-weight: 800;
      letter-spacing: .25em;
      text-transform: uppercase;
      opacity: 0;
      animation: apparaitre .7s ease .15s forwards;
    }

    h1 {
      margin: 0;
      max-width: 820px;
      font-size: clamp(2rem, 8vw, 4.5rem);
      font-weight: normal;
      line-height: .98;
      text-wrap: balance;
      text-shadow: 0 3px 20px rgba(0,0,0,.8);
      opacity: 0;
      translate: 0 12px;
      animation: titre .8s ease .42s forwards;
    }

    .objet-wrap {
      position: relative;
      width: min(68vw, 410px);
      margin: clamp(16px, 3vh, 30px) auto 8px;
      perspective: 900px;
    }

    .objet-wrap::after {
      content: "";
      position: absolute;
      left: 13%;
      right: 13%;
      bottom: 1%;
      height: 12%;
      border-radius: 50%;
      background: rgba(0,0,0,.68);
      filter: blur(18px);
      transform: scaleX(.72);
      animation: ombre var(--duree-entree) cubic-bezier(.2,.8,.2,1) both;
    }

    .objet {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: auto;
      filter:
        drop-shadow(0 14px 13px rgba(0,0,0,.72))
        drop-shadow(0 0 22px rgba(145,160,168,.28));
      opacity: 0;
      transform: translateY(42vh) scale(.3) rotateZ(-24deg) rotateY(60deg);
      animation:
        surgir var(--duree-entree) cubic-bezier(.12,.82,.2,1.05) .2s forwards,
        flotter 3.2s ease-in-out 1.45s infinite;
      will-change: transform;
    }

    .description {
      max-width: 520px;
      min-height: 2.5em;
      margin: 6px auto 0;
      color: var(--brume);
      font-family: Inter, Arial, sans-serif;
      font-size: clamp(.92rem, 3.5vw, 1.08rem);
      line-height: 1.5;
      opacity: 0;
      animation: apparaitre .8s ease 1.2s forwards;
    }

    .collection {
      position: relative;
      padding: 17px max(14px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
      border-top: 1px solid rgba(145, 160, 168, .36);
      background:
        linear-gradient(rgba(27,32,34,.94), rgba(23,37,44,.98)),
        var(--nuit);
      box-shadow: 0 -15px 55px rgba(0,0,0,.42);
      opacity: 0;
      translate: 0 28px;
      animation: tiroir .8s ease 1.35s forwards;
    }

    .collection-entete {
      width: min(100%, 720px);
      margin: 0 auto 12px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      font-family: Inter, Arial, sans-serif;
    }

    .collection-entete strong {
      font-size: .86rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .compteur {
      color: var(--pierre);
      font-size: .86rem;
      font-weight: 800;
    }

    .emplacements {
      width: min(100%, 720px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(6px, 1.5vw, 12px);
    }

    .emplacement {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border: 1px solid rgba(145,160,168,.42);
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,255,255,.055), rgba(0,0,0,.28) 67%),
        var(--charbon);
      box-shadow: inset 0 2px 8px rgba(0,0,0,.75);
    }

    .emplacement::before {
      content: "?";
      color: rgba(227,217,202,.24);
      font: normal clamp(1rem, 4vw, 1.8rem) Georgia, serif;
    }

    .emplacement.trouve {
      border-color: var(--cuivre);
      box-shadow:
        inset 0 2px 8px rgba(0,0,0,.75),
        0 0 17px rgba(168,95,61,.42);
      animation: valider .6s ease 2.05s both;
    }

    .emplacement.trouve::before { display: none; }

    .emplacement img {
      width: 90%;
      height: 90%;
      object-fit: contain;
      opacity: 0;
      scale: .2;
      animation: ranger .65s cubic-bezier(.2,1.45,.35,1) 1.95s forwards;
    }

    .actions {
      width: min(100%, 720px);
      margin: 14px auto 0;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .bouton {
      min-height: 46px;
      padding: 10px 20px;
      border: 1px solid var(--charpente);
      border-radius: 999px;
      background: var(--charpente);
      color: var(--ivoire);
      font-family: Inter, Arial, sans-serif;
      font-size: .94rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,.35);
      transition: transform .15s ease, filter .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .bouton.secondaire {
      border-color: rgba(200,187,170,.45);
      background: transparent;
      color: var(--pierre);
    }

    .bouton:active { transform: scale(.96); }
    .bouton:hover { filter: brightness(1.12); }

    @keyframes surgir {
      0% {
        opacity: 0;
        transform: translateY(42vh) scale(.3) rotateZ(-24deg) rotateY(60deg);
      }
      68% { opacity: 1; }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotateZ(0) rotateY(0);
      }
    }

    @keyframes flotter {
      0%, 100% { transform: translateY(0) rotateZ(-1deg); }
      50% { transform: translateY(-10px) rotateZ(1deg); }
    }

    @keyframes ombre {
      from { opacity: 0; transform: scaleX(.15); }
      to { opacity: 1; transform: scaleX(.72); }
    }

    @keyframes titre {
      to { opacity: 1; translate: 0 0; }
    }

    @keyframes apparaitre {
      to { opacity: 1; }
    }

    @keyframes tiroir {
      to { opacity: 1; translate: 0 0; }
    }

    @keyframes ranger {
      to { opacity: 1; scale: 1; }
    }

    @keyframes valider {
      50% { scale: 1.15; }
      100% { scale: 1; }
    }

    @media (max-height: 700px) {
      .objet-wrap { width: min(43vh, 310px); margin-block: 8px 2px; }
      .scene { padding-bottom: 8px; }
      .description { margin-top: 0; }
      .collection { padding-top: 10px; }
      .collection-entete { margin-bottom: 7px; }
      .actions { margin-top: 8px; }
    }

    @media (max-width: 520px) {
      .emplacements { gap: 5px; }
      .actions { flex-direction: column-reverse; }
      .bouton { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="decouverte" aria-labelledby="titre-artefact">
    <section class="scene">
      <p class="surtitre">Artefact découvert</p>
      <h1 id="titre-artefact">Le disque de schiste</h1>

      <div class="objet-wrap">
        <img
          class="objet"
          src="images/3-webpdisquedeschiste.webp"
          alt="Disque de schiste gravé d’une rose des vents"
        >
      </div>

      <p class="description">
        La première pièce du secret est désormais en votre possession.
      </p>
    </section>

    <section class="collection" aria-label="Collection d’artefacts">
      <div class="collection-entete">
        <strong>Collection d’artefacts</strong>
        <span class="compteur" id="compteur">1 / 4</span>
      </div>

      <div class="emplacements">
        <div class="emplacement trouve" title="Schiste">
          <img src="images/3-webpdisquedeschiste.webp" alt="Schiste obtenu">
        </div>
        <div class="emplacement" title="Deuxième artefact — à découvrir"></div>
        <div class="emplacement" title="Troisième artefact — à découvrir"></div>
        <div class="emplacement" title="Quatrième artefact — à découvrir"></div>
      </div>

      <div class="actions">
        <button class="bouton secondaire" type="button" id="rejouer">
          Rejouer l’animation
        </button>
        <button class="bouton" type="button" id="continuer">
          Continuer l’aventure
        </button>
      </div>
    </section>
  </main>

  <script>
    /* ==============================================================
       RÉGLAGES À MODIFIER POUR INTÉGRER CETTE PAGE À TON AVENTURE
       ============================================================== */
    const CONFIG = {
      pageSuivante: "etape-suivante.html",
      sauvegarderDansLeNavigateur: true,
      vibration: true,
      son: true
    };

    const CLE_COLLECTION = "avelescape-quimper-artefacts";

    // Enregistre le schiste dans la collection du joueur.
    function sauvegarderArtefact() {
      if (!CONFIG.sauvegarderDansLeNavigateur) return;

      try {
        const collection = JSON.parse(localStorage.getItem(CLE_COLLECTION) || "[]");
        if (!collection.includes("schiste")) collection.push("schiste");
        localStorage.setItem(CLE_COLLECTION, JSON.stringify(collection));
      } catch (erreur) {
        console.warn("La progression n’a pas pu être sauvegardée.", erreur);
      }
    }

    // Petit son de découverte créé par le navigateur : aucun fichier MP3 requis.
    function jouerSonDecouverte() {
      if (!CONFIG.son) return;

      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audio = new AudioContext();
        const gain = audio.createGain();
        gain.connect(audio.destination);
        gain.gain.setValueAtTime(0.0001, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.16, audio.currentTime + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 1.15);

        [220, 329.63, 440].forEach((frequence, index) => {
          const oscillateur = audio.createOscillator();
          oscillateur.type = "sine";
          oscillateur.frequency.value = frequence;
          oscillateur.connect(gain);
          oscillateur.start(audio.currentTime + index * 0.12);
          oscillateur.stop(audio.currentTime + 1.2);
        });
      } catch (erreur) {
        // Certains mobiles bloquent le son automatique : l’animation continue.
      }
    }

    function lancerDecouverte() {
      sauvegarderArtefact();

      if (CONFIG.vibration && navigator.vibrate) {
        setTimeout(() => navigator.vibrate([40, 45, 80]), 700);
      }

      // Le son automatique peut être refusé par iPhone/Android avant un toucher.
      setTimeout(jouerSonDecouverte, 250);
    }

    document.getElementById("continuer").addEventListener("click", () => {
      window.location.href = CONFIG.pageSuivante;
    });

    document.getElementById("rejouer").addEventListener("click", () => {
      jouerSonDecouverte();
      document.body.style.display = "none";
      void document.body.offsetHeight;
      document.body.style.display = "";
    });

    lancerDecouverte();
  </script>
</body>
</html>
