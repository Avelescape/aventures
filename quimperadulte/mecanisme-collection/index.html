<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coffret des artefacts</title>
  <style>
    :root { --duree-vol: 1500ms; --accent2: #E28A50; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #17252c;
      font-family: Georgia, "Times New Roman", serif;
    }
    .scene { position: relative; width: min(100vw, 100svh, 900px); aspect-ratio: 1; }
    .coffret { display: block; width: 100%; height: 100%; object-fit: contain; }

    /* Coordonnées recalibrées sur le nouveau coffret 1254 × 1254. */
    .logement {
      position: absolute;
      left: 71.93%;
      width: 10.85%;
      aspect-ratio: 1;
      translate: -50% -50%;
      border-radius: 50%;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    .logement:nth-of-type(1) { top: 46.81%; }
    .logement:nth-of-type(2) { top: 57.81%; }
    .logement:nth-of-type(3) { top: 68.74%; }
    .logement:nth-of-type(4) { top: 79.75%; }
    .logement img {
      width: 86%;
      height: 86%;
      object-fit: contain;
      border-radius: 50%;
      opacity: 0;
      filter: drop-shadow(0 5px 5px rgb(0 0 0 / .65));
    }
    .logement.rempli img { animation: pose .5s cubic-bezier(.2,1.5,.35,1) forwards; }
    .artefact-volant {
      position: fixed;
      z-index: 10;
      width: min(36vw, 260px);
      height: auto;
      left: 50%;
      top: -10px;
      translate: -50% 0;
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
      filter: drop-shadow(0 12px 10px rgb(0 0 0 / .7));
    }
    @keyframes pose { from { opacity: 0; scale: .35; } to { opacity: 1; scale: 1; } }
    @media (prefers-reduced-motion: reduce) { :root { --duree-vol: 1ms; } }

    /* Bouton retour au site AvelEscape */
    .site-retour {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      z-index: 999999;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 7px 12px;
      background: rgba(23, 37, 44, 0.90);
      color: #E9DDC7;
      border: 2px solid var(--accent2);
      border-radius: 999px;
      font-family: Georgia, serif;
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(0,0,0,.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .site-retour:hover { background: var(--accent2); color: #17252c; }
    .site-retour:active { transform: scale(0.96); }

    /* Bouton "Suite", révélé une fois l'artefact posé dans son logement */
    .bouton-suite {
      position: fixed;
      z-index: 25;
      left: 50%;
      bottom: max(80px, calc(env(safe-area-inset-bottom) + 80px));
      transform: translate(-50%, 10px);
      padding: 12px 30px;
      border: 2px solid var(--accent2);
      border-radius: 999px;
      background: rgba(23, 37, 44, .92);
      color: #E9DDC7;
      font-family: Georgia, serif;
      font-size: clamp(1.14rem, 3.8vw, 1.34rem);
      font-weight: 700;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s ease, transform .4s ease;
      box-shadow: 0 8px 22px rgba(0,0,0,.5);
    }
    .bouton-suite.visible { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    .bouton-suite:active { transform: translate(-50%, 0) scale(.96); }
  </style>
</head>
<body>

  <!-- BOUTON RETOUR AU SITE AVELESCAPE -->
  <a class="site-retour" href="../index.html">
    <span>Site AvelEscape</span>
  </a>

  <main class="scene" id="scene" tabindex="0" aria-label="Coffret d'artefacts">
    <img class="coffret" src="images/3-webpboite.webp" alt="Coffret ouvert avec quatre logements">
    <div class="logement" data-index="0"></div>
    <div class="logement" data-index="1"></div>
    <div class="logement" data-index="2"></div>
    <div class="logement" data-index="3"></div>
  </main>
  <img class="artefact-volant" id="artefact-volant" alt="">
  <audio id="son-arrivee" src="sons/piecearrivee.mp3" preload="auto"></audio>
  <button class="bouton-suite" id="bouton-suite" type="button">Continuer la quête</button>

  <script>
    /* L’URL indique seulement l’artefact qui arrive :
       ?artefact=cle pour 3-webp1, ?artefact=couronne pour 3-webp2, etc. */
    const parametres = new URLSearchParams(location.search);

    const artefactActuel = parametres.get("artefact") || "cle";

    const suitesParArtefact = {
      cle: "artefact-couronne",
      couronne: "artefact-triskel",
      triskel: "artefact-hermine",
      hermine: "fin"
    };

    /* Ordre réel de la quête : seuls les artefacts placés avant l'actuel
       doivent déjà être visibles dans le coffret. */
    const ordreArtefacts = ["cle", "couronne", "triskel", "hermine"];

    const CONFIG = {
      artefactActuel,
      /* Le logement est déduit de l’ordre de la quête. Cela empêche 3-webp2
         d’être envoyé par erreur dans le premier logement. */
      logementActuel: Math.max(0, ordreArtefacts.indexOf(artefactActuel)),
      /* La suite dépend de l’artefact réellement posé, sans ancien paramètre
         « suite » susceptible d’ouvrir la mauvaise page. */
      pageSuivante: (() => {
        const suite = suitesParArtefact[artefactActuel] || "artefact-couronne";
        /* Le paramètre et l’ancre se doublent mutuellement pour garantir
           l’ouverture de la bonne scène sur tous les navigateurs. */
        return `../index.html?scene=${encodeURIComponent(suite)}#${suite}`;
      })(),
      delaiAvantVol: 450,
      vibration: true,
      sauvegarder: true,
      cleCollection: "avelescape-quimper-artefacts-v2",
      artefacts: {
        cle:      { image: "images/3-webp1.webp", nom: "La Clé" },
        couronne: { image: "images/3-webp2.webp", nom: "La Couronne" },
        triskel:  { image: "images/3-webp3.webp", nom: "Le Triskel" },
        hermine:  { image: "images/3-webp4.webp", nom: "L’Hermine" }
      }
    };

    const scene = document.getElementById("scene");
    const volant = document.getElementById("artefact-volant");
    const boutonSuite = document.getElementById("bouton-suite");
    const sonArrivee = document.getElementById("son-arrivee");
    const logements = [...document.querySelectorAll(".logement")];
    const recuperationManuelle = ["cle", "couronne", "triskel", "hermine"].includes(CONFIG.artefactActuel);
    let peutContinuer = false;
    let animationEnCours = false;

    function collectionSauvegardee() {
      if (!CONFIG.sauvegarder) return [];
      try { return JSON.parse(localStorage.getItem(CONFIG.cleCollection) || "[]"); }
      catch { return []; }
    }

    function afficherArtefactDans(logement, artefact, anime = false) {
      const image = document.createElement("img");
      image.src = artefact.image;
      image.alt = artefact.nom;
      logement.replaceChildren(image);
      if (anime) logement.classList.add("rempli");
      else { image.style.opacity = "1"; image.style.scale = "1"; }
    }

    function restaurerCollection() {
      const positionActuelle = ordreArtefacts.indexOf(CONFIG.artefactActuel);

      /* On repart toujours d'un coffret visuellement vide, puis on replace
         uniquement les artefacts qui précèdent celui qui arrive. */
      logements.forEach(logement => logement.replaceChildren());

      ordreArtefacts.slice(0, Math.max(0, positionActuelle)).forEach((id, logement) => {
        afficherArtefactDans(logements[logement], CONFIG.artefacts[id]);
      });
    }

    function sauvegarderActuel() {
      if (!CONFIG.sauvegarder) return;
      const positionActuelle = ordreArtefacts.indexOf(CONFIG.artefactActuel);
      const collection = ordreArtefacts.slice(0, positionActuelle + 1).map((id, logement) => ({
        id,
        logement
      }));
      localStorage.setItem(CONFIG.cleCollection, JSON.stringify(collection));
    }

    async function lancerAnimation() {
      if (animationEnCours || peutContinuer) return;
      const artefact = CONFIG.artefacts[CONFIG.artefactActuel];
      const cible = logements[CONFIG.logementActuel];
      if (!artefact || !cible) return;
      animationEnCours = true;

      volant.src = artefact.image;
      volant.alt = artefact.nom;
      /* Attendre les dimensions réelles avant de calculer le trajet. */
      await volant.decode().catch(() => {});
      const depart = volant.getBoundingClientRect();
      const arrivee = cible.getBoundingClientRect();
      const echelle = (arrivee.width * .86) / depart.width;
      const dx = arrivee.left + arrivee.width / 2 - (depart.left + depart.width / 2);
      const dy = arrivee.top + arrivee.height / 2 - (depart.top + depart.height / 2);

      const animation = volant.animate([
        { opacity: 0, transform: "translate(0, -25px) scale(.7)" },
        { opacity: 1, transform: "translate(0, 0) scale(1)", offset: .18 },
        { opacity: 1, transform: `translate(${dx}px, ${dy}px) scale(${echelle})` }
      ], { duration: parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--duree-vol")),
           easing: "cubic-bezier(.22,.72,.28,1)", fill: "forwards" });

      await animation.finished.catch(() => {});
      /* Le remplissage forwards de Web Animations prime sur le style inline.
         Annuler l’animation retire son image finale avant la pose définitive. */
      animation.cancel();
      volant.style.opacity = "0";
      afficherArtefactDans(cible, artefact);
      sauvegarderActuel();
      peutContinuer = true;
      boutonSuite.disabled = false;
      boutonSuite.textContent = CONFIG.artefactActuel === "hermine"
        ? "Poursuivre l'aventure"
        : "Continuer la quête";
      boutonSuite.classList.add("visible");
      if (window.parent && window.parent !== window) {
        window.parent.postMessage("mecanisme-ouvert", "*");
      }
      if (CONFIG.vibration && navigator.vibrate) navigator.vibrate([35, 40, 70]);
    }

    function continuer() {
      if (!peutContinuer) return;

      /* Après la pose du quatrième artefact, on revient dans l’index
         principal sur la page présentant les quatre artefacts réunis. */
      if (CONFIG.artefactActuel === "hermine") {
        location.href = "../index.html?scene=artefacts-reunis#artefacts-reunis";
        return;
      }

      /* Sécurité de progression : le 3e logement correspond au Triskel.
         Une fois rempli, on ouvre obligatoirement la
         page Hermine de l’index principal, même si un ancien lien contient
         encore un paramètre de navigation incorrect. */
      if (CONFIG.logementActuel === 2 || CONFIG.artefactActuel === "triskel") {
        location.href = "../index.html?scene=artefact-hermine#artefact-hermine";
        return;
      }

      location.href = CONFIG.pageSuivante;
    }
    boutonSuite.addEventListener("click", () => {
      if (!recuperationManuelle || peutContinuer) {
        continuer();
        return;
      }

      boutonSuite.disabled = true;
      sonArrivee.currentTime = 0;
      sonArrivee.play().catch(erreur => {
        console.warn("Impossible de lire le son d’arrivée de l’artefact.", erreur);
      });
      lancerAnimation();
    });
    scene.addEventListener("click", continuer);
    scene.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") continuer();
    });

    restaurerCollection();
    if (recuperationManuelle) {
      boutonSuite.textContent = "Récupérer l’artefact";
      boutonSuite.classList.add("visible");
    } else {
      setTimeout(lancerAnimation, CONFIG.delaiAvantVol);
    }
  </script>
</body>
</html>
