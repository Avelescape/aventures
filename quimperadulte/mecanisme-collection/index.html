<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Artefacts découverts</title>
  <style>
    :root { --duree-vol: 1500ms; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #17252c;
      font-family: Georgia, "Times New Roman", serif;
    }
    .scene { position: relative; width: min(100vw, 100svh, 900px); aspect-ratio: 1; }
    .coffret { display: block; width: 100%; height: 100%; object-fit: contain; }

    /* Coordonnées relevées sur l'image 1254 × 1254. */
    .logement {
      position: absolute;
      left: 75.92%;
      width: 14.75%;
      aspect-ratio: 1;
      translate: -50% -50%;
      border-radius: 50%;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    .logement:nth-of-type(1) { top: 29.19%; }
    .logement:nth-of-type(2) { top: 44.10%; }
    .logement:nth-of-type(3) { top: 59.25%; }
    .logement:nth-of-type(4) { top: 74.08%; }
    .logement img {
      width: 86%;
      height: 86%;
      object-fit: contain;
      border-radius: 50%;
      opacity: 0;
      filter: drop-shadow(0 5px 5px rgb(0 0 0 / .65));
    }
    .logement.rempli img { animation: pose .5s cubic-bezier(.2,1.5,.35,1) forwards; }
    .artefact-volant {
      position: fixed;
      z-index: 10;
      width: min(36vw, 260px);
      height: auto;
      left: 50%;
      top: -10px;
      translate: -50% 0;
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
      filter: drop-shadow(0 12px 10px rgb(0 0 0 / .7));
    }
    .titre {
      position: fixed;
      z-index: 20;
      left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom));
      margin: 0;
      color: #f1e4ce;
      text-align: center;
      font-size: clamp(1.3rem, 5vw, 2.5rem);
      text-shadow: 0 3px 8px #000;
      pointer-events: none;
    }
    @keyframes pose { from { opacity: 0; scale: .35; } to { opacity: 1; scale: 1; } }
    @media (prefers-reduced-motion: reduce) { :root { --duree-vol: 1ms; } }
  </style>
</head>
<body>
  <main class="scene" id="scene" tabindex="0" aria-label="Coffret d'artefacts">
    <img class="coffret" src="images/3-webpcoffretvide.webp" alt="Coffret ouvert avec quatre logements">
    <div class="logement" data-index="0"></div>
    <div class="logement" data-index="1"></div>
    <div class="logement" data-index="2"></div>
    <div class="logement" data-index="3"></div>
  </main>
  <img class="artefact-volant" id="artefact-volant" alt="">
  <h1 class="titre">Artefacts découverts</h1>

  <script>
    const CONFIG = {
      /* Pour les pages suivantes, remplacer l'identifiant et le logement (0 à 3). */
      artefactActuel: "schiste",
      logementActuel: 0,
      pageSuivante: "etape-suivante.html",
      delaiAvantVol: 450,
      vibration: true,
      sauvegarder: true,
      cleCollection: "avelescape-quimper-artefacts",
      artefacts: {
        schiste: { image: "images/3-webpdisquedeschiste.webp", nom: "Disque de schiste" },
        argile:   { image: "images/artefact-argile.webp", nom: "Artefact d’argile" },
        cuir:     { image: "images/artefact-cuir.webp", nom: "Artefact de cuir" },
        metal:    { image: "images/artefact-metal.webp", nom: "Artefact de métal" }
      }
    };

    const scene = document.getElementById("scene");
    const volant = document.getElementById("artefact-volant");
    const logements = [...document.querySelectorAll(".logement")];
    let peutContinuer = false;

    function collectionSauvegardee() {
      if (!CONFIG.sauvegarder) return [];
      try { return JSON.parse(localStorage.getItem(CONFIG.cleCollection) || "[]"); }
      catch { return []; }
    }

    function afficherArtefactDans(logement, artefact, anime = false) {
      const image = document.createElement("img");
      image.src = artefact.image;
      image.alt = artefact.nom;
      logement.replaceChildren(image);
      if (anime) logement.classList.add("rempli");
      else { image.style.opacity = "1"; image.style.scale = "1"; }
    }

    function restaurerCollection() {
      collectionSauvegardee().forEach(entree => {
        const artefact = CONFIG.artefacts[entree.id];
        const logement = logements[entree.logement];
        if (artefact && logement && entree.id !== CONFIG.artefactActuel) {
          afficherArtefactDans(logement, artefact);
        }
      });
    }

    function sauvegarderActuel() {
      if (!CONFIG.sauvegarder) return;
      const collection = collectionSauvegardee().filter(x => x.id !== CONFIG.artefactActuel);
      collection.push({ id: CONFIG.artefactActuel, logement: CONFIG.logementActuel });
      localStorage.setItem(CONFIG.cleCollection, JSON.stringify(collection));
    }

    async function lancerAnimation() {
      const artefact = CONFIG.artefacts[CONFIG.artefactActuel];
      const cible = logements[CONFIG.logementActuel];
      if (!artefact || !cible) return;

      volant.src = artefact.image;
      volant.alt = artefact.nom;
      await volant.decode().catch(() => {});
      const depart = volant.getBoundingClientRect();
      const arrivee = cible.getBoundingClientRect();
      const echelle = (arrivee.width * .86) / depart.width;
      const dx = arrivee.left + arrivee.width / 2 - (depart.left + depart.width / 2);
      const dy = arrivee.top + arrivee.height / 2 - (depart.top + depart.height / 2);

      const animation = volant.animate([
        { opacity: 0, transform: "translate(0, -25px) scale(.7)" },
        { opacity: 1, transform: "translate(0, 0) scale(1)", offset: .18 },
        { opacity: 1, transform: `translate(${dx}px, ${dy}px) scale(${echelle})` }
      ], { duration: parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--duree-vol")),
           easing: "cubic-bezier(.22,.72,.28,1)", fill: "forwards" });

      await animation.finished.catch(() => {});
      volant.style.opacity = "0";
      afficherArtefactDans(cible, artefact, true);
      sauvegarderActuel();
      peutContinuer = true;
      if (CONFIG.vibration && navigator.vibrate) navigator.vibrate([35, 40, 70]);
    }

    function continuer() { if (peutContinuer) location.href = CONFIG.pageSuivante; }
    scene.addEventListener("click", continuer);
    scene.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") continuer();
    });

    restaurerCollection();
    setTimeout(lancerAnimation, CONFIG.delaiAvantVol);
  </script>
</body>
</html>
