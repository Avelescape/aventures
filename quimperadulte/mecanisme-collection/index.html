<!doctype html>
<!-- VERSION MILIEU HAUT : départ centré en haut de l’écran -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17252c">
  <title>Artefacts découverts</title>

  <style>
    :root {
      --ivoire: #e3d9ca;
      --pierre: #c8bbaa;
      --ardoise: #586b7b;
      --charpente: #344753;
      --nuit: #17252c;
      --charbon: #1b2022;
      --gris-pierre: #756f68;
      --cuivre: #a85f3d;
      --brume: #91a0a8;
      --duree-entree: 1100ms;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--nuit);
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      color: var(--ivoire);
    }

    button { font: inherit; }

    .decouverte {
      position: relative;
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(155deg, rgba(88,107,123,.32) 0%, transparent 42%),
        linear-gradient(25deg, #344753 0%, var(--nuit) 56%, var(--charbon) 100%);
    }

    .decouverte::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      opacity: .28;
      background-image:
        repeating-linear-gradient(23deg, transparent 0 7px, rgba(255,255,255,.025) 8px 9px);
    }

    .scene {
      min-height: 0;
      display: grid;
      place-items: center;
      align-content: center;
      padding: max(24px, env(safe-area-inset-top)) 18px 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      max-width: 1000px;
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: normal;
      line-height: 1.02;
      text-wrap: balance;
      text-shadow: 0 3px 20px rgba(0,0,0,.8);
      opacity: 0;
      translate: 0 12px;
      animation: titre .8s ease .42s forwards;
    }

    .objet {
      position: fixed;
      left: 50%;
      right: auto;
      top: 12px;
      z-index: 20;
      display: block;
      width: min(56vw, 360px);
      height: auto;
      pointer-events: none;
      filter:
        drop-shadow(0 14px 13px rgba(0,0,0,.72))
        drop-shadow(0 0 22px rgba(145,160,168,.28));
      opacity: 0;
      transform-origin: top left;
      will-change: transform;
    }

    .collection {
      position: relative;
      padding: 17px max(14px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
      border-top: 1px solid rgba(145, 160, 168, .36);
      background:
        linear-gradient(rgba(27,32,34,.94), rgba(23,37,44,.98)),
        var(--nuit);
      box-shadow: 0 -15px 55px rgba(0,0,0,.42);
      opacity: 0;
      translate: 0 28px;
      animation: tiroir .55s ease .1s forwards;
    }

    .emplacements {
      width: min(100%, 720px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(6px, 1.5vw, 12px);
    }

    .emplacement {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border: 1px solid rgba(145,160,168,.42);
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,255,255,.055), rgba(0,0,0,.28) 67%),
        var(--charbon);
      box-shadow: inset 0 2px 8px rgba(0,0,0,.75);
    }

    .emplacement::before {
      content: "?";
      color: rgba(227,217,202,.24);
      font: normal clamp(1rem, 4vw, 1.8rem) Georgia, serif;
    }

    .emplacement.recu {
      border-color: var(--cuivre);
      box-shadow:
        inset 0 2px 8px rgba(0,0,0,.75),
        0 0 17px rgba(168,95,61,.42);
      animation: valider .6s ease both;
    }

    .emplacement.recu::before { display: none; }

    .emplacement img {
      width: 90%;
      height: 90%;
      object-fit: contain;
      opacity: 0;
      scale: .2;
    }

    .emplacement.recu img {
      animation: ranger .55s cubic-bezier(.2,1.45,.35,1) forwards;
    }

    @keyframes titre {
      to { opacity: 1; translate: 0 0; }
    }

    @keyframes apparaitre {
      to { opacity: 1; }
    }

    @keyframes tiroir {
      to { opacity: 1; translate: 0 0; }
    }

    @keyframes ranger {
      to { opacity: 1; scale: 1; }
    }

    @keyframes valider {
      50% { scale: 1.15; }
      100% { scale: 1; }
    }

    @media (max-height: 700px) {
      .scene { padding-bottom: 8px; }
      .collection { padding-top: 10px; }
    }

    @media (max-width: 520px) {
      .emplacements { gap: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="decouverte" aria-labelledby="titre-artefact" tabindex="0">
    <section class="scene">
      <h1 id="titre-artefact">Artefacts découverts</h1>

      <img
        class="objet"
        id="artefact-volant"
        src="images/3-webpdisquedeschiste.webp"
        alt="Disque de schiste gravé d’une rose des vents"
      >

    </section>

    <section class="collection" aria-label="Collection d’artefacts">
      <div class="emplacements">
        <div class="emplacement" id="emplacement-schiste">
          <img src="images/3-webpdisquedeschiste.webp" alt="Schiste obtenu">
        </div>
        <div class="emplacement"></div>
        <div class="emplacement"></div>
        <div class="emplacement"></div>
      </div>
    </section>
  </main>

  <script>
    /* ==============================================================
       RÉGLAGES À MODIFIER POUR INTÉGRER CETTE PAGE À TON AVENTURE
       ============================================================== */
    const CONFIG = {
      pageSuivante: "etape-suivante.html",
      sauvegarderDansLeNavigateur: true,
      vibration: true,
      son: true
    };

    const CLE_COLLECTION = "avelescape-quimper-artefacts";

    // Enregistre le schiste dans la collection du joueur.
    function sauvegarderArtefact() {
      if (!CONFIG.sauvegarderDansLeNavigateur) return;

      try {
        const collection = JSON.parse(localStorage.getItem(CLE_COLLECTION) || "[]");
        if (!collection.includes("schiste")) collection.push("schiste");
        localStorage.setItem(CLE_COLLECTION, JSON.stringify(collection));
      } catch (erreur) {
        console.warn("La progression n’a pas pu être sauvegardée.", erreur);
      }
    }

    // Petit son de découverte créé par le navigateur : aucun fichier MP3 requis.
    function jouerSonDecouverte() {
      if (!CONFIG.son) return;

      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audio = new AudioContext();
        const gain = audio.createGain();
        gain.connect(audio.destination);
        gain.gain.setValueAtTime(0.0001, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.16, audio.currentTime + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 1.15);

        [220, 329.63, 440].forEach((frequence, index) => {
          const oscillateur = audio.createOscillator();
          oscillateur.type = "sine";
          oscillateur.frequency.value = frequence;
          oscillateur.connect(gain);
          oscillateur.start(audio.currentTime + index * 0.12);
          oscillateur.stop(audio.currentTime + 1.2);
        });
      } catch (erreur) {
        // Certains mobiles bloquent le son automatique : l’animation continue.
      }
    }

    let animationEnCours = null;
    let peutContinuer = false;

    function animerVersLaCollection() {
      const disque = document.getElementById("artefact-volant");
      const emplacement = document.getElementById("emplacement-schiste");

      animationEnCours?.cancel();
      peutContinuer = false;
      emplacement.classList.remove("recu");
      disque.style.opacity = "0";

      const cible = emplacement.getBoundingClientRect();
      const tailleDisque = disque.getBoundingClientRect().width;
      const tailleFinale = cible.width * 0.9;
      const echelleFinale = tailleFinale / tailleDisque;

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        emplacement.classList.add("recu");
        peutContinuer = true;
        return;
      }

      // L’image est fixée directement à la fenêtre, sans conteneur intermédiaire.
      // Sa largeur réduite est prise en compte pour le centrer exactement.
      const echelleDepart = 0.62;
      disque.style.right = "auto";
      disque.style.left = `${(window.innerWidth - tailleDisque * echelleDepart) / 2}px`;
      disque.style.top = "12px";
      disque.style.transform = "none";
      void disque.offsetWidth;

      const depart = disque.getBoundingClientRect();
      const arriveeBordGauche = cible.left + cible.width * 0.05;
      const arriveeHaut = cible.top + cible.height * 0.05;
      const deplacementX = arriveeBordGauche - depart.left;
      const deplacementY = arriveeHaut - depart.top;

      animationEnCours = disque.animate([
        {
          opacity: 0,
          transform: `translate(0, 0) scale(${echelleDepart}) rotate(0deg)`
        },
        {
          opacity: 1,
          transform: `translate(0, 0) scale(${echelleDepart}) rotate(0deg)`,
          offset: 0.18
        },
        {
          opacity: 1,
          transform: `translate(${deplacementX}px, ${deplacementY}px) scale(${echelleFinale}) rotate(0deg)`
        }
      ], {
        duration: 1950,
        easing: "cubic-bezier(.22,.72,.28,1)",
        fill: "forwards"
      });

      animationEnCours.finished.then(() => {
        disque.style.opacity = "0";
        animationEnCours.cancel();
        animationEnCours = null;
        emplacement.classList.add("recu");
        peutContinuer = true;

        if (CONFIG.vibration && navigator.vibrate) {
          navigator.vibrate([35, 40, 70]);
        }
      }).catch(() => {
        // L’annulation est normale lorsque le joueur appuie sur « Rejouer ».
      });
    }

    function lancerDecouverte() {
      sauvegarderArtefact();

      // Le son automatique peut être refusé par iPhone/Android avant un toucher.
      setTimeout(jouerSonDecouverte, 250);
      setTimeout(animerVersLaCollection, 500);
    }

    const ecran = document.querySelector(".decouverte");

    ecran.addEventListener("click", () => {
      if (peutContinuer) window.location.href = CONFIG.pageSuivante;
    });

    ecran.addEventListener("keydown", (evenement) => {
      if (peutContinuer && (evenement.key === "Enter" || evenement.key === " ")) {
        window.location.href = CONFIG.pageSuivante;
      }
    });

    lancerDecouverte();
  </script>
</body>
</html>
