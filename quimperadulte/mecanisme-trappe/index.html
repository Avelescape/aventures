<script>
  const scene = document.querySelector('#scene');
  const trappe = document.querySelector('#trappe');
  const sonEngrenage = document.querySelector('#son-engrenage');

  let ouvertureLancee = false;

  function ouvrirTrappe() {
    if (ouvertureLancee) return;
    ouvertureLancee = true;

    sonEngrenage.currentTime = 0;
    sonEngrenage.play().catch(() => {
      // L’animation fonctionne même si le son est absent.
    });

    scene.classList.add('ouverte');
    scene.setAttribute('aria-label', 'La trappe est ouverte');
  }

  // Changement de page lorsque la trappe a terminé son ouverture.
  trappe.addEventListener('transitionend', (event) => {
    if (
      ouvertureLancee &&
      event.propertyName === 'transform'
    ) {
      window.location.href = '../index.html';
    }
  });

  scene.addEventListener('pointerdown', ouvrirTrappe, { once: true });

  scene.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      ouvrirTrappe();
    }
  });
</script>
