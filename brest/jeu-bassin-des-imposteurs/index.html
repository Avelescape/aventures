<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AvelEscape — Le Bassin des imposteurs</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--green:#123f36;--ivory:#f5f0e5;--gold:#d7bd7b}*{box-sizing:border-box}body{margin:0;background:#092c2b;color:var(--ivory);font-family:'Cormorant Garamond',Georgia,serif}.app{max-width:560px;margin:auto;min-height:100dvh;background:var(--green)}header{text-align:center;padding:14px 12px;font-size:clamp(26px,7vw,36px);font-weight:700}.scene{position:relative;width:100%;aspect-ratio:1024/1536;background:#0a3e3a}.scene img{display:block;width:100%;height:100%;object-fit:cover}.panel{padding:17px 19px 25px;text-align:center;background:var(--green)}.question{font-size:26px;font-weight:700;margin:0 0 12px}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.buttons[hidden], [hidden]{display:none!important}button{font:700 23px 'Cormorant Garamond',Georgia,serif;border:1px solid var(--gold);border-radius:12px;padding:12px 16px;background:var(--ivory);color:var(--green);cursor:pointer}button.secondary{background:transparent;color:var(--ivory)}.result{border:1px solid var(--gold);padding:14px;margin:16px 0 12px;text-align:left;border-radius:10px;background:#0c302b;font-size:22px;line-height:1.2;white-space:pre-line}.result strong{color:#f3d38b}.progress{font-size:20px;opacity:.9;margin-bottom:12px}
</style></head><body><main class="app"><header>Le Bassin des imposteurs</header><section class="scene" aria-label="Le palais sous-marin de Neptune"><img id="sceneImage" src="images/4-webpbassinconque.webp" alt="Une conque posée au sol devant Neptune dans son palais sous-marin"></section><section class="panel"><div class="progress" id="progress"></div><p class="question" id="question">Cette créature est-elle présente sur le canot des Napoléon ?</p><div class="buttons" id="choices"><button id="yes">Présente sur le canot</button><button class="secondary" id="no">Imposteur !</button></div><div class="result" id="result" hidden></div><button id="next" hidden>Créature suivante →</button></section></main><script>
// Une image COMPLÈTE du palais par étape : pas de superposition transparente.
// Ajouter les futures images dans images/ puis compléter la propriété scene.
// present: null signifie que la réponse doit encore être vérifiée sur le vrai canot.
const creatures=[
{name:'Conque',scene:'images/4-webpbassinconque.webp',present:true,info:'« Tu reconnais ce coquillage, le bulot ? C’est une conque !\n\nDans la mythologie, les Tritons l’utilisent comme une trompette. Son puissant appel peut calmer les vagues ou annoncer l’arrivée du dieu des mers.\n\nD’ailleurs, mes deux putti joufflus, à l’avant du canot, en tiennent chacun une ! »'},
{name:'Dragon marin',scene:'images/1-webpbassindragon.webp',present:true,info:'« Ah ! Mes deux dragons marins !\n\nDes écailles, des griffes, des ailes… De quoi faire trembler les plus courageux !\n\nTu les trouveras à l’arrière du Canot des Napoléon.\n\nEt ne t’inquiète pas, le bulot, ils sont bien dressés… Contrairement à certains aventuriers qui débarquent dans mon royaume ! »'},
{name:'Taureau marin',scene:'images/4-webpbassintaureau.webp',present:false,info:'« Tu pensais vraiment trouver ce gros taureau marin sur le Canot des Napoléon ?\n\nFigure-toi, le bulot, que cette créature mi-taureau, mi-poisson peuplait les récits de la mythologie antique !\n\nMais allons ! Napoléon aimait les dorures, pas les étables flottantes ! »'},
{name:'Monstres marins',scene:'images/4-webpbassinmonstre.webp',present:true,info:'« Ah ! Mes monstres marins ! Quand mes deux putti joufflus ne soufflent pas assez fort dans leurs conques, ils leur pincent les fesses !\n\nCrois-moi, le bulot, après ça, ils soufflent comme des baleines enrhumées !\n\nPas de pincement trop fort, il ne faudrait pas dégonfler mes petits joufflus ! »'},
{name:'Hippocampe',scene:'images/4-webpbassinhippocampe.webp',present:true,info:'« Dans la mythologie, mes hippocampes tirent mon char à travers les océans !\n\nSur le Canot des Napoléon, tu en trouveras un à l’avant, et d’autres chevauchés par mes petits putti !\n\nEh oui, le bulot ! Même mes joufflus savent monter à cheval… »'},
{name:'Bouc marin',scene:'images/4-webpbassinbouc.webp',present:false,info:'« Figure-toi, le bulot, que cette drôle de bestiole existait dans l’imaginaire antique !\n\nMais sur le Canot des Napoléon ? Certainement pas !\n\nNapoléon aimait les dorures et les parfums… Pas les boucs qui empestent à trois milles nautiques ! »'}
];
const successMessages=['Tonnerre des océans ! Bien joué, le bulot !','Mille tentacules ! Le bulot a un cerveau !','Par ma barbe ! Tu as trouvé !','Eh bien ! Il y a donc quelque chose sous cette coquille !','Eh bien, le bulot ! Tu as l’œil !','Par mon trident ! Tu as l’œil d’un hippocampe !'];
const failureMessages=['Même une moule aurait fait mieux !','Ton cerveau est resté à marée basse ?','Tu réfléchis ou tu fais des bulles ?','J’ai vu des huîtres plus perspicaces !','Tu me fatigues, le bulot…','Ton cerveau prend l’eau, le bulot !'];
let i=0;const $=id=>document.getElementById(id);function show(){const c=creatures[i];$('sceneImage').src=c.scene;$('sceneImage').alt=c.name+' dans le palais de Neptune';$('sceneImage').onerror=()=>{if(!$('sceneImage').src.endsWith('4-webppalaisneptune.webp'))$('sceneImage').src='images/4-webppalaisneptune.webp'};$('progress').textContent='Créature '+(i+1)+' / '+creatures.length+' — '+c.name;$('question').textContent='Cette créature est-elle présente sur le canot des Napoléon ?';$('choices').hidden=false;$('result').hidden=true;$('next').hidden=true}function answer(choice){const c=creatures[i];const known=c.present!==null;const verdict=!known?'Réponse à confirmer après vérification des sculptures du canot.':choice===c.present?successMessages[i]:failureMessages[i];$('result').replaceChildren();const strong=document.createElement('strong');strong.textContent=verdict;const p=document.createElement('p');p.textContent=(c.name==='Conque'||c.name==='Dragon marin'||c.name==='Taureau marin'||c.name==='Monstres marins'||c.name==='Hippocampe'||c.name==='Bouc marin')?c.info:c.info;$('result').append(strong,p);$('result').hidden=false;$('choices').hidden=true;$('next').hidden=false;$('next').textContent=i===creatures.length-1?'Suite':'Créature suivante →'}function next(){if(i<creatures.length-1){i++;show()}else{document.querySelector('header').hidden=true;$('sceneImage').src='images/4-webpneptunenage.webp';$('sceneImage').alt='Neptune nage vers la surface';$('sceneImage').onerror=null;$('progress').hidden=true;$('question').hidden=true;$('choices').hidden=true;$('result').hidden=true;$('next').hidden=false;$('next').textContent='Sortir de l’eau';$('next').onclick=()=>{window.location.href='../index.html?retour_bassin=1';};}}$('yes').onclick=()=>answer(true);$('no').onclick=()=>answer(false);$('next').onclick=next;show();
</script></body></html>
