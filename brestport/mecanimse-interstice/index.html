<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Dernière Caisse — La cachette du muret</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, serif; background: #10211e; color: #fff4dc; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    main { width: min(100% - 20px, 520px); margin: 0 auto; padding: 12px 0 20px; }
    h1, p { text-align: center; }
    h1 { margin: 0 0 5px; font-size: clamp(23px, 5vw, 30px); }
    p { margin: 0 0 10px; font-size: clamp(15px, 3.8vw, 18px); line-height: 1.3; }
    .scene { position: relative; isolation: isolate; overflow: hidden; aspect-ratio: 3 / 4;
      border: 1px solid #8b8069; border-radius: 8px; user-select: none; }
    .scene img { display: block; pointer-events: none; -webkit-user-drag: none; }
    .wall { width: 100%; height: 100%; object-fit: cover; }
    .empty-bag-patch {
      position: absolute; left: 17.6796%; top: 76.6575%; width: 22.0994%; height: 4.558%;
      mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent),
        linear-gradient(to bottom, transparent, #000 20%, #000 83%, transparent);
      mask-composite: intersect;
      opacity: 0;
    }
    .scene.ingot-lifted .empty-bag-patch { opacity: 1; }
    button { font: inherit; }
    .slot, .ingot { position: absolute; border: 0; padding: 0; background: transparent; }
    .slot { left: 36%; top: 39.5%; width: 23%; height: 7%; min-height: 34px; cursor: pointer; }
    .ingot { z-index: 2; left: 28%; top: 78.3%; width: 16%; min-width: 44px; aspect-ratio: 1;
      transform: translate(-50%, -50%); cursor: grab; touch-action: none; }
    .ingot img { width: 100%; height: 100%; object-fit: contain; transform: rotate(-16deg);
      filter: saturate(.82) brightness(.83); }
    .ingot.in-bag { left: 28.6%; top: 79.3%; width: 20%; height: 44px; }
    .ingot.in-bag:not(.inserting) img { opacity: 0; }
    .ingot.in-hand, .ingot.inserting { z-index: 4; }
    .ingot.in-hand { cursor: grabbing; }
    .ingot.inserting { pointer-events: none; }
    .ingot.in-hand img { filter: drop-shadow(0 3px 3px #0009); }
    .slot:focus-visible, .ingot:focus-visible, .ingot[aria-pressed="true"]:not(.in-hand) {
      outline: 2px solid #f7dd9b; outline-offset: 1px; border-radius: 4px;
    }
    .gold-edge {
      position: absolute; z-index: 3; left: 44.15%; top: 42.38%; width: 10%;
      height: 1.32%; pointer-events: none; transform: rotate(3deg);
      clip-path: polygon(0 32%, 9% 11%, 74% 3%, 100% 22%, 96% 73%, 74% 94%, 18% 88%, 3% 72%);
      background: #503617;
    }
    .gold-edge img {
      position: absolute; left: -4%; top: -183%; width: 108%; height: auto;
      transform: rotate(-41deg); filter: saturate(.74) brightness(.89);
    }
    .gold-edge::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(#19120ce3, transparent 42%, #eac78835 74%, #1b130c8c);
    }
    .next-cache {
      display: table; margin: 12px auto 0; min-height: 44px; padding: 10px 20px;
      border: 1px solid #d3b679; border-radius: 6px; background: #22372e;
      color: inherit; text-decoration: none; font-weight: bold;
    }
    .next-cache:hover, .next-cache:focus-visible { background: #344b3f; }
    .status:empty { display: none; }
    .status { min-height: 1.3em; margin: 9px 0 0; }
  </style>
</head>

  <script>
    'use strict';

    const scene = document.getElementById('scene');
    const ingot = document.getElementById('ingot');
    const slot = document.getElementById('slot');
    const status = document.getElementById('status');
    const goldEdge = document.getElementById('gold-edge');
    const nextCache = document.getElementById('next-cache');
    const ingotImage = ingot.querySelector('img');
    goldEdge.querySelector('img').src = ingotImage.src;
    let inserting = false;
    let drag = null;
    let suppressPointerClick = false;

    function setSelected(selected) {
      ingot.setAttribute('aria-pressed', String(selected));
      status.textContent = selected ? 'Touchez la fente du muret pour y glisser le lingot.' : '';
    }

    async function putInWall() {
      if (inserting) return;
      inserting = true;
      slot.disabled = true;
      const start = ingot.getBoundingClientRect();
      const frame = scene.getBoundingClientRect();
      const size = start.width;
      const targetX = frame.left + frame.width * .4915;
      const targetY = frame.top + frame.height * .431;
      const dx = targetX - (start.left + size / 2);
      const dy = targetY - (start.top + start.height / 2);

      scene.classList.add('ingot-lifted');
      ingot.classList.add('inserting');
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches && ingot.animate) {
        const motion = ingot.animate([
          { transform: 'translate(-50%, -50%)', offset: 0 },
          { transform: 'translate(-50%, -50%) translate(' + dx + 'px, ' + (dy + size * .15) + 'px)', offset: .44 },
          { transform: 'translate(-50%, -50%) translate(' + dx + 'px, ' + dy + 'px) scale(.72, .19)', offset: 1 }
        ], { duration: 650, easing: 'ease-in-out', fill: 'forwards' });
        const tilt = ingotImage.animate([
          { transform: getComputedStyle(ingotImage).transform },
          { transform: 'rotate(-41deg)', offset: .45 },
          { transform: 'rotate(-41deg)', offset: 1 }
        ], { duration: 650, easing: 'ease-in-out', fill: 'forwards' });
        await Promise.allSettled([motion.finished, tilt.finished]);
        ingot.hidden = true;
        motion.cancel();
        tilt.cancel();
      } else {
        ingot.hidden = true;
      }
      slot.hidden = true;
      goldEdge.hidden = false;
      status.textContent = '';
      nextCache.hidden = false;
      nextCache.focus({ preventScroll: true });
    }

    function resetPosition() {
      scene.classList.remove('ingot-lifted');
      ingot.style.removeProperty('left');
      ingot.style.removeProperty('top');
      ingot.classList.add('in-bag');
      ingot.classList.remove('in-hand');
    }

    ingot.addEventListener('pointerdown', (event) => {
      if (inserting || !event.isPrimary || event.button !== 0) return;
      suppressPointerClick = false;
      drag = { id: event.pointerId, x: event.clientX, y: event.clientY, moved: false };
      ingot.setPointerCapture(event.pointerId);
    });

    ingot.addEventListener('pointermove', (event) => {
      if (drag?.id !== event.pointerId) return;
      if (!drag.moved && Math.hypot(event.clientX - drag.x, event.clientY - drag.y) < 7) return;
      drag.moved = true;
      scene.classList.add('ingot-lifted');
      ingot.classList.remove('in-bag');
      ingot.classList.add('in-hand');
      const frame = scene.getBoundingClientRect();
      ingot.style.left = (event.clientX - frame.left - scene.clientLeft) + 'px';
      ingot.style.top = (event.clientY - frame.top - scene.clientTop) + 'px';
    });

    ingot.addEventListener('pointerup', (event) => {
      if (drag?.id !== event.pointerId) return;
      const { moved } = drag;
      drag = null;
      if (!moved) return;
      suppressPointerClick = true;
      const target = slot.getBoundingClientRect();
      if (event.clientX >= target.left && event.clientX <= target.right &&
          event.clientY >= target.top && event.clientY <= target.bottom) {
        putInWall();
      } else {
        resetPosition();
        setSelected(false);
        status.textContent = 'Glissez le lingot un peu plus près de la fente.';
      }
    });

    function cancelDrag() {
      if (!drag) return;
      drag = null;
      resetPosition();
    }

    ingot.addEventListener('pointercancel', cancelDrag);
    ingot.addEventListener('lostpointercapture', cancelDrag);
    ingot.addEventListener('click', (event) => {
      if (inserting || ingot.hidden || (suppressPointerClick && event.detail !== 0)) return;
      const selected = ingot.getAttribute('aria-pressed') !== 'true';
      setSelected(selected);
      if (selected && event.detail === 0) slot.focus();
    });
    slot.addEventListener('click', () => {
      if (ingot.getAttribute('aria-pressed') === 'true') putInWall();
    });
  </script>
</body>
</html>
