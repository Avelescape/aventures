<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#232923">
  <title>La cachette du quai · La Dernière Caisse</title>
  <style>
    :root {
      color-scheme: dark;
      background: #232923;
      color: #f5eddb;
      font-family: Georgia, serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      width: min(100% - 24px, 550px, max(320px, calc((100svh - 140px) * .75)));
      margin: 0 auto;
      padding: 15px 0 12px;
    }
    header { text-align: center; padding: 0 4px 13px; }
    h1 { font-size: clamp(1.6rem, 6vw, 2.2rem); font-weight: 400; margin: 0 0 4px; }
    p { font-size: 1rem; line-height: 1.25; margin: 0; color: #e6d7b8; }
    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 2px solid #ffe8aa; outline-offset: 3px; }
    .scene {
      position: relative;
      isolation: isolate;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #374945;
      border-radius: 5px;
      box-shadow: 0 0 0 1px #bfab7955, 0 8px 22px #090c0980;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overflow: hidden;
    }
    .scene img { display: block; pointer-events: none; }
    .quai { width: 100%; height: 100%; }
    .ombre {
      position: absolute;
      left: 3%;
      top: 85%;
      width: 36%;
      height: 3.6%;
      background: #1c160cc4;
      border-radius: 50%;
      filter: blur(7px);
      transform: rotate(3deg);
    }
    .sac {
      position: absolute;
      width: 40%;
      left: 1%;
      top: 61%;
      filter: brightness(.91) saturate(.87);
      transform: rotate(-5deg);
    }
    .lingot, .ouverture, .bloc-anneau, .pierre-sous-anneau {
      position: absolute;
      padding: 0;
      border: 0;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
    }
    .lingot {
      z-index: 2;
      width: max(13.5%, 44px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      touch-action: none;
      cursor: grab;
    }
    .lingot img {
      position: absolute;
      width: 100%;
      top: 0;
      transform: rotate(-26deg);
      filter: drop-shadow(1px 2px 2px #130a02b3);
    }
    .lingot.dans-le-sac img {
      clip-path: polygon(0 0, 100% 0, 100% 87%, 0 40%);
      filter: brightness(.87) saturate(.87);
    }
    .bloc-anneau {
      z-index: 3;
      width: 29.3%;
      height: 20.6%;
      left: 65.4%;
      top: 72.05%;
      pointer-events: none;
    }
    .lingot.en-main { cursor: grabbing; }
    .bloc-anneau span {
      display: block;
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: var(--photo-quai) 92.5% 90.74% / 341.297% 485.437% no-repeat;
      clip-path: polygon(
        0% 42%, 2% 31%, 7% 22%, 13% 15%, 23% 8%, 32% 4%, 40% 3%,
        42% 1%, 45% 0%, 50% 0%, 53% 2%, 56% 6%, 66% 5%, 75% 8%,
        83% 13%, 90% 21%, 95% 31%, 97% 43%, 97% 57%, 94% 69%,
        89% 78%, 82% 85%, 74% 91%, 64% 96%, 53% 98%, 43% 98%,
        33% 96%, 24% 93%, 16% 87%, 9% 79%, 5% 70%, 2% 60%, 0% 51%
      );
      visibility: hidden;
    }
    .pierre-sous-anneau {
      left: 64.4%;
      top: 71.55%;
      width: 32.9%;
      height: 22.4%;
      background: var(--photo-quai) 4.024% 92.204% / 303.951% 446.429% no-repeat;
      transform: scaleX(-1);
      mask-image: linear-gradient(to right, transparent, #000 5%, #000 94%, transparent),
        linear-gradient(to bottom, transparent, #000 3%, #000 94%, transparent);
      mask-composite: intersect;
      visibility: hidden;
    }
    .anneau-deplace .pierre-sous-anneau,
    .anneau-deplace .bloc-anneau span { visibility: visible; }
    .lingot.selectionne img { filter: drop-shadow(0 0 4px #ffe4a5); }
    .ouverture {
      left: 41.3%;
      top: 74.6%;
      width: 22%;
      height: 14.5%;
      border-radius: 50%;
      cursor: default;
      touch-action: manipulation;
    }
    .ouverture.active {
      cursor: pointer;
      box-shadow: inset 0 0 0 1.5px #ffe3a887, inset 0 0 16px #e3b55538;
    }
    .commandes {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }
    .revisser {
      align-content: center;
      text-align: center;
      min-height: 44px;
      padding: 6px 15px;
      border: 1px solid #beac7e;
      border-radius: 4px;
      background: #383d31;
      cursor: pointer;
    }
    .revisser {
      color: #232923;
      background: #e6d7b8;
      text-decoration: none;
    }
    .revisser:focus-visible { outline: 2px solid #ffe8aa; outline-offset: 3px; }
  </style>
</head>

    const lingot = document.querySelector('.lingot');
    const anneau = document.querySelector('.bloc-anneau');
    const ouverture = document.querySelector('.ouverture');
    const consigne = document.querySelector('#consigne');
    const revisser = document.querySelector('.revisser');
    const cible = { x: 52.3, y: 81.85 };
    const departLingot = { x: 21.3, y: 70.3 };
    const centreBloc = { x: 14.1, y: 9.95 };
    const consigneDepot = 'Faites glisser le lingot du sac dans le trou.';
    const positionFermee = { x: cible.x - centreBloc.x, y: cible.y - centreBloc.y };
    let phase = 'lingot';
    let selection = false;

    scene.style.setProperty('--photo-quai', 'url("' + document.querySelector('.quai').src + '")');

    function placer(objet, { x, y }) {
      objet.style.left = x + '%';
      objet.style.top = y + '%';
    }

    function position(evenement) {
      const cadre = scene.getBoundingClientRect();
      return {
        x: (evenement.clientX - cadre.left) / cadre.width * 100,
        y: (evenement.clientY - cadre.top) / cadre.height * 100
      };
    }

    function dansLeTrou({ x, y }) {
      return ((x - cible.x) / 11) ** 2 + ((y - cible.y) / 7.25) ** 2 <= 1;
    }

    function selectionner(active) {
      selection = active;
      lingot.classList.toggle('selectionne', active);
      lingot.setAttribute('aria-pressed', String(active));
      ouverture.disabled = !active;
      ouverture.classList.toggle('active', active);
      consigne.textContent = active ? 'Touchez le trou pour y déposer le lingot.' : consigneDepot;
    }

    async function deposer() {
      if (phase !== 'lingot') return;
      selectionner(false);
      phase = 'chute';
      lingot.classList.remove('dans-le-sac');
      placer(lingot, cible);
      lingot.disabled = true;
      const reduire = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const chute = lingot.animate([
        { transform: 'translate(-50%, -50%) scale(1)', filter: 'brightness(1)' },
        { transform: 'translate(-50%, -28%) scale(.67)', filter: 'brightness(.53)', offset: .78 },
        { transform: 'translate(-50%, -30%) scale(.64)', filter: 'brightness(.50)' }
      ], { duration: reduire ? 0 : 425, easing: 'ease-in', fill: 'forwards' });
      await chute.finished;
      phase = 'fermee';
      placer(anneau, positionFermee);
      scene.classList.add('anneau-deplace');
      lingot.hidden = true;
      consigne.textContent = 'Le bloc est en place. Revissez-le pour refermer la cachette.';
      revisser.hidden = false;
      revisser.focus({ preventScroll: true });
    }

    function rendreDeplacable(objet, phaseObjet, depart, decalageCentre, commencer, remettre, valider) {
      let prise = null;

      function suivre(evenement) {
        const point = position(evenement);
        const emplacement = { x: point.x + prise.decalageX, y: point.y + prise.decalageY };
        placer(objet, emplacement);
        const centre = { x: emplacement.x + decalageCentre.x, y: emplacement.y + decalageCentre.y };
        const auDessus = dansLeTrou(point) || dansLeTrou(centre);
        ouverture.classList.toggle('active', auDessus);
        return auDessus;
      }

      objet.addEventListener('pointerdown', evenement => {
        if (phase !== phaseObjet || prise || evenement.button !== 0) return;
        const origine = position(evenement);
        prise = {
          id: evenement.pointerId,
          debutX: evenement.clientX,
          debutY: evenement.clientY,
          decalageX: depart.x - origine.x,
          decalageY: depart.y - origine.y,
          bouge: false
        };
        objet.setPointerCapture(prise.id);
      });

      objet.addEventListener('pointermove', evenement => {
        if (prise?.id !== evenement.pointerId) return;
        const distance = Math.hypot(evenement.clientX - prise.debutX, evenement.clientY - prise.debutY);
        if (!prise.bouge && distance < 5) return;
        if (!prise.bouge) {
          prise.bouge = true;
          selectionner(false);
          objet.classList.add('en-main');
          commencer();
        }
        suivre(evenement);
      });

      objet.addEventListener('pointerup', evenement => {
        if (prise?.id !== evenement.pointerId) return;
        if (!prise.bouge) {
          prise = null;
          selectionner(!selection);
          return;
        }
        const auDessus = suivre(evenement);
        prise = null;
        objet.classList.remove('en-main');
        if (auDessus) valider();
        else remettre();
      });

      function annuler(evenement) {
        if (prise?.id !== evenement.pointerId) return;
        prise = null;
        objet.classList.remove('en-main');
        remettre();
      }

      objet.addEventListener('pointercancel', annuler);
      objet.addEventListener('lostpointercapture', annuler);
      objet.addEventListener('click', evenement => {
        if (evenement.detail !== 0 || phase !== phaseObjet) return;
        selectionner(!selection);
        if (selection) ouverture.focus({ preventScroll: true });
      });
    }

    function remettreLingot() {
      placer(lingot, departLingot);
      lingot.classList.add('dans-le-sac');
      ouverture.classList.toggle('active', selection);
    }

    rendreDeplacable(lingot, 'lingot', departLingot, { x: 0, y: 0 },
      () => lingot.classList.remove('dans-le-sac'), remettreLingot, deposer);

    ouverture.addEventListener('click', () => {
      if (selection) deposer();
    });

    remettreLingot();
  </script>
</body>
</html>
