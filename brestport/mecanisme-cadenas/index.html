:root{--gold:#ceb27e;--ink:#e8dfca;--dark:#171a18;--bronze:#7a572f}*{box-sizing:border-box}

.sand-repair{position:absolute;left:61.71875%;top:65.625%;width:38.28125%;height:34.375%;z-index:1;pointer-events:none;user-select:none}.stage.unlocked .sand-repair{display:none}
.stage:after{content:'';pointer-events:none;position:absolute;inset:0;box-shadow:inset 0 0 45px #17150f88}
.lock-zoom {
  width: min(calc(100% - 20px), 460px);
  max-height: calc(100% - 20px);
  padding: clamp(7px, 2vw, 12px);
  border: 1px solid #bc9c62;
  border-radius: 9px;

}

/* Gros plan sur la zone x=40,5–58,5 %, y=33–55 % de la photo. */
.lock-detail {
  position: relative;
  width: min(100%, 430px);
  aspect-ratio: 27 / 22;
  margin: 0 auto;
  border: 1px solid #bc9c62;
  border-radius: 3px;
  background: #514737 var(--bg-locked) no-repeat 49.39% 42.31% / 555.56% 454.55%;
}
.wheels {
  position: absolute;
  left: 18.33%;
  top: 38.18%;
  width: 63.06%;
  height: 42.05%;
  display: flex;
  justify-content: space-between;
  z-index: 3;
  container-type: inline-size;
  filter: drop-shadow(0 1px 1px #160e08);
}
.wheel {
  appearance: none;
  width: 23%;
  height: 100%;
  padding: 0;
  display: grid;
  grid-template-rows: 27% 46% 27%;
  place-items: center;
  overflow: hidden;
  border: 1px solid #352719;
  border-radius: 9% / 7%;
  background:
    linear-gradient(180deg, #21170edf 0%, #39281980 18%, transparent 40%, #ffe0a326 48%, transparent 61%, #30221991 83%, #1a110ce8 100%),
    repeating-linear-gradient(0deg, #4b371b24 0 1px, transparent 1px 3px),
    linear-gradient(90deg, #725334 0%, #ac8853 11%, #c6a874 34%, #ac8a55 70%, #684a2e 97%);
  box-shadow: inset 1px 0 #e5bd7b66, inset -1px 0 #382719cc;
  color: #21170e;
  cursor: ns-resize;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.wheel b {
  font: 700 28px/1 Arial, sans-serif;
  font-size: clamp(22px, 15cqw, 42px);
  font-variant-numeric: lining-nums tabular-nums;
  text-shadow: 0 1px #f2d49a88;
  pointer-events: none;
}
.wheel .ghost {
  font-size: .8em;
  font-size: clamp(15px, 11cqw, 30px);

  transform: scaleY(.74);
}
.wheel:focus-visible{outline:3px solid #e8d69c;outline-offset:2px}.stone{position:absolute;left:63.48%;top:67.38%;width:33.53%;height:28.81%;z-index:5;object-fit:fill;cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(4px 6px 4px #0004);transition:filter .15s}
.stone.dragging{cursor:grabbing;filter:drop-shadow(10px 13px 7px #0008) brightness(1.07)}
.lock-zone {
  position: absolute;
  left: 49.9%;
  top: 46.2%;
  width: max(44px, 18%);
  height: max(44px, 19%);
  transform: translate(-50%, -50%);
  z-index: 4;
  padding: 0;
  border: 1px solid #f5d18b90;
  border-radius: 6px;
  background: transparent;
  cursor: zoom-in;
  touch-action: manipulation;
}
.lock-zone:hover { background: #f5d18b24 }
.lock-zone:focus-visible { outline: 3px solid #f5d18b; outline-offset: 3px }
.stage.unlocked .lock-zone { display: none }
.impact{position:absolute;left:49.8%;top:47%;width:8%;aspect-ratio:1;transform:translate(-50%,-50%) scale(0);border:4px solid #ffedbd;border-radius:50%;box-shadow:0 0 38px #ffde95;opacity:0;pointer-events:none;z-index:7}.impact.go{animation:impact .65s ease-out}@keyframes impact{10%{opacity:1;transform:translate(-50%,-50%) scale(.35)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.3)}}
.broken{position:absolute;left:41%;top:36.7%;width:17%;height:19%;z-index:6;display:none;align-items:center;justify-content:center;transform:rotate(-20deg);filter:drop-shadow(2px 8px 4px #0009);font-size:clamp(15px,4vw,42px);color:#e0bd78;text-shadow:0 2px #30200e}
.stage.unlocked{background-image:var(--bg-broken)!important}.stage.unlocked .stone{opacity:0;pointer-events:none}.stage.unlocked .broken{display:none}@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translate(20%,105%) rotate(45deg);opacity:0}}
.hint-mini{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);z-index:6;background:#181b19c9;border:1px solid #d6bd8b7a;color:#e8d6ab;padding:7px 13px;font:clamp(9px,1.3vw,13px) 'Special Elite',monospace;text-align:center;max-width:95%;pointer-events:none;transition:opacity .3s}
.panel{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:15px 18px;background:#24251f;border-top:1px solid #6d5840}.status{font-size:18px;line-height:1.3;flex:1;min-width:190px}.status b{font-weight:600;color:#dabb85}.button{border:1px solid #b39259;background:linear-gradient(#49432e,#2a281d);border-radius:3px;color:#f2e2bd;padding:10px 18px;font:12px 'Special Elite',monospace;cursor:pointer}.button:hover{background:#554932}.button:focus-visible{outline:2px solid #fff}.actions{display:flex;gap:9px;flex-wrap:wrap}
.tips{text-align:center;margin-top:14px;font-size:16px;color:#bcb29f}.tips strong{color:#dfceaa;font-weight:600}.success{display:none;margin-top:14px;background:#25281f;border:1px solid #85704c;text-align:center;padding:20px}.success h2{margin:0 0 7px;font-weight:500;color:#e6cd92;font-size:28px}.success p{font-size:18px;margin:5px 0 14px}.gold{display:none;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:15px}.ingot{width:100px;height:54px;background:linear-gradient(145deg,#fff1a0,#c68a25 55%,#80500c);clip-path:polygon(14% 5%,85% 5%,100% 90%,0 90%);box-shadow:inset 0 0 18px #73460e;color:#674510;display:grid;place-items:center;font:bold 14px Georgia}.gold.revealed{display:flex}

:root{--kaki:#5F6B4F;--kaki-fonce:#4E5942;--kaki-profond:#3F4736;--kaki-clair:#6C765C;--ivoire:#F2DFC4;--laiton-mat:#A38E67;--encre:#241F1B}

<p class="footnote">BREST · JUIN 1940</p></main><script>
(()=>{'use strict';
const stage=document.getElementById('stage'),stone=document.getElementById('stone'),wheels=document.getElementById('wheels'),status=document.getElementById('status'),micro=document.getElementById('micro'),impact=document.getElementById('impact'),success=document.getElementById('success'),gold=null;
const initial=[7,3,5,1];let digits=[...initial],moves=0,attempts=0,hintCount=0,unlocked=false,drag=null;
const lockZoom = document.getElementById('lock-zoom');
document.getElementById('target').addEventListener('click', () => {
  if (!unlocked && !drag) lockZoom.showModal();
});
const say=(s)=>{status.hidden=false;status.innerHTML=s};
function showWheel(i){let d=digits[i];let node=wheels.children[i];node.innerHTML=`<b class="ghost">${(d+9)%10}</b><b class="now">${d}</b><b class="ghost">${(d+1)%10}</b>`;node.setAttribute('aria-label',`Molette ${i+1}, chiffre ${d}`)}
function rotate(i,change=1){if(unlocked)return;digits[i]=(digits[i]+change+10)%10;showWheel(i);moves++; }
initial.forEach((digit,i)=>{const el=document.createElement('button');el.type='button';el.className='wheel';el.setAttribute('aria-label',`Molette ${i+1}`);let down=null;el.addEventListener('pointerdown',e=>{down={y:e.clientY,id:e.pointerId,moved:false};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!down||e.pointerId!==down.id)return;let delta=e.clientY-down.y;if(Math.abs(delta)>12){rotate(i,delta>0?1:-1);down.y=e.clientY;down.moved=true}});el.addEventListener('pointerup',e=>{if(!down)return;if(!down.moved)rotate(i,1);down=null});el.addEventListener('pointercancel',()=>down=null);el.addEventListener('wheel',e=>{e.preventDefault();rotate(i,e.deltaY>0?1:-1)},{passive:false});el.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();rotate(i,e.key==='ArrowDown'?1:-1)}});wheels.appendChild(el);showWheel(i)});
const start={x:63.48,y:67.38},size={w:33.53,h:28.81};let pos={...start};
function paint(){stone.style.left=pos.x+'%';stone.style.top=pos.y+'%'}
function coords(e){const r=stage.getBoundingClientRect();return{x:((e.clientX-r.left)/r.width)*100,y:((e.clientY-r.top)/r.height)*100}}
function hit(){const cx=pos.x+size.w*.49,cy=pos.y+size.h*.45;return Math.hypot(cx-49.4,(cy-45.8)*1.5)<13.3}
function open(){unlocked=true;impact.classList.remove('go');void impact.offsetWidth;impact.classList.add('go');stone.style.transition='left .2s,top .2s,filter .2s,opacity .2s';pos={x:44.8,y:42.8};paint();setTimeout(()=>{stage.classList.add('unlocked');micro.hidden=true;micro.textContent='';},230);setTimeout(()=>{success.style.display='block';success.scrollIntoView({behavior:'smooth',block:'nearest'})},700)}
stone.addEventListener('pointerdown',e=>{if(unlocked)return;e.preventDefault();let p=coords(e);drag={id:e.pointerId,offX:p.x-pos.x,offY:p.y-pos.y};stone.classList.add('dragging');stone.setPointerCapture(e.pointerId);micro.hidden=false;micro.textContent='Amenez le galet vers le cadenas.'});
stone.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id||unlocked)return;const p=coords(e);pos.x=Math.max(-4,Math.min(104-size.w,p.x-drag.offX));pos.y=Math.max(-5,Math.min(104-size.h,p.y-drag.offY));paint();if(hit()){drag=null;stone.classList.remove('dragging');open()}});
stone.addEventListener('pointerup',e=>{if(!drag)return;drag=null;stone.classList.remove('dragging');if(!unlocked){stone.style.transition='left .35s,top .35s';pos={...start};paint();setTimeout(()=>stone.style.transition='',380)}});
stone.addEventListener('pointercancel',()=>{drag=null;stone.classList.remove('dragging');if(!unlocked){pos={...start};paint()}});
document.getElementById('hint').addEventListener('click',()=>{if(unlocked)return;hintCount=Math.min(hintCount+1,2);micro.hidden=true;micro.textContent='';say(hintCount===1?'<b>Indice 1 :</b> La solution est sur le sable.':'<b>Indice 2 :</b> Un objet pourrait bien avoir une autre utilité que celle de rester posé dans le sable.');document.getElementById('hint').textContent=hintCount===1?'Indice 2':'Indice 2';if(hintCount===2)document.getElementById('hint').disabled=true;});
document.getElementById('reset').addEventListener('click',()=>{digits=[...initial];moves=0;attempts=0;hintCount=0;unlocked=false;drag=null;for(let i=0;i<4;i++)showWheel(i);stage.classList.remove('unlocked');stone.style.transition='';stone.classList.remove('dragging');pos={...start};paint();status.textContent='';status.hidden=true;micro.hidden=false;micro.textContent='';micro.hidden=true;success.style.display='none';document.getElementById('hint').textContent='Indice 1';document.getElementById('hint').disabled=false;document.getElementById('reveal').disabled=false;document.getElementById('reveal').textContent='Ouvrir la caisse'});
document.getElementById('reveal').addEventListener('click',()=>{window.location.href='../index.html?scene=coffre-ouvert';});
})();
