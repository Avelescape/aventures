<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121611">
<title>La machine à remonter le temps · La Dernière Caisse</title>
<style>
:root {
  color-scheme: dark;
  --ink: #f1e5c7;
  --muted: #c4bca3;
  --amber: #ffcc78;
  --signal: var(--amber);
  --type: "Special Elite", "Courier New", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-height: 100svh;
  padding: clamp(18px, 4vw, 46px) 12px;
  display: grid;
  place-items: center;
  color: var(--ink);
  background: radial-gradient(ellipse at 50% 10%, #313522, #141912 53%, #090c09 96%);
  font-family: Georgia, serif;
}
main { width: min(100%, 800px); }
header { text-align: center; margin-bottom: 18px; }
.kicker {
  margin: 0 0 9px;
  color: #e3bd83;
  font: 700 .72rem var(--type);
  letter-spacing: .25em;
  text-transform: uppercase;
}
h1 { font-weight: 400; font-size: clamp(1.65rem, 6vw, 2.75rem); margin: 0; line-height: 1; }
header p:last-child { margin: 9px 0 0; color: var(--muted); font-size: 1rem; }
.console {
  padding: clamp(16px, 4vw, 28px);
  position: relative;
  border: 1px solid #807450;
  border-radius: 20px;
  background:
    repeating-linear-gradient(8deg, #ffffff04 0 1px, transparent 1px 4px),
    linear-gradient(145deg, #4c4b32, #262c22 52%, #303225);
  box-shadow: inset 0 0 0 5px #14181199, inset 0 1px 0 6px #cabb8a45, 0 17px 36px #0009;
}
.screw {
  position: absolute;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  border: 1px solid #948767;
  box-shadow: 0 1px 2px #000;
  background: linear-gradient(135deg, #777459 41%, #221e14 43% 55%, #524d38 57%);
}
.screw:nth-child(1) { top: 11px; left: 11px; }
.screw:nth-child(2) { top: 11px; right: 11px; }
.screw:nth-child(3) { bottom: 11px; left: 11px; }
.screw:nth-child(4) { bottom: 11px; right: 11px; }
@property --opening {
  syntax: "<length>";
  inherits: true;
  initial-value: 0px;
}
.viewport {
  position: relative;
  display: grid;
  container-type: inline-size;
  --portal-x: 50%;
  --portal-y: 45%;
  margin: 0 auto;
  isolation: isolate;
  overflow: hidden;
  border: clamp(3px, 1vw, 7px) solid #342c1b;
  border-radius: 8px;
  background: #171a14;
  box-shadow: 0 0 0 1px #b6a072, 0 0 0 3px #b6a07230, 0 4px 10px #000a;
}
.view-image {
  grid-area: 1 / 1;
  display: block;
  width: 100%;
  height: auto;
}
.portal {
  position: absolute;
  inset: 0;
  --opening: 0px;
  visibility: hidden;
  pointer-events: none;
}
.view-current { clip-path: circle(var(--opening) at var(--portal-x) var(--portal-y)); }
.viewport::after {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 15px #17140e88;
  pointer-events: none;
}
.view-label {
  position: absolute;
  z-index: 2;
  inset: auto 8px 8px auto;
  display: flex;
  align-items: center;
  gap: 6px 12px;
  flex-wrap: wrap;
  padding: 6px 10px;
  border: 1px solid #d6b78670;
  border-radius: 3px;
  color: var(--signal);
  background: #161813ed;
}
.place { font: 700 .68rem var(--type); letter-spacing: .2em; text-transform: uppercase; }
.year { font: 700 clamp(1rem, 4vw, 1.4rem) var(--type); font-variant-numeric: tabular-nums; }
.portal::before, .portal::after {
  content: "";
  position: absolute;
  inset: 0;
}
.portal::before {
  opacity: 0;
  background: radial-gradient(ellipse at var(--portal-x) var(--portal-y),
    #fff1b9 0%, #ffab4366 10%, #d06b2929 24%, transparent 43%);
  mix-blend-mode: screen;
}
.portal::after {
  background: radial-gradient(circle at var(--portal-x) var(--portal-y),
    transparent max(0px, calc(var(--opening) - 3cqw)),
    #3bc5d37a max(0px, calc(var(--opening) - 1cqw)),
    #fff3d9 max(0px, calc(var(--opening) - .35cqw)),
    #fff4db var(--opening),
    #ff9b4dc4 calc(var(--opening) + .6cqw),
    #ff994026 calc(var(--opening) + 2cqw),
    transparent calc(var(--opening) + 4cqw));
  opacity: 0;
  mix-blend-mode: screen;
}
.travel .view-past { animation: port-charge var(--travel-time) ease both; }
.travel .portal {
  visibility: visible;
  animation: portal-opening var(--travel-time) both;
}
.travel .portal::before { animation: portal-charge var(--travel-time) ease both; }
.travel .portal::after { animation: portal-edge var(--travel-time) ease both; }
.travel .view-label { animation: instrument-power var(--travel-time) ease both; }
.arrived { --signal: #9ae5df; }
.arrived .portal { visibility: visible; }
.arrived .view-current { clip-path: none; }
@keyframes port-charge {
  0%, 100% { filter: none; }
  23% { filter: brightness(.58) saturate(.58); }
  54% { filter: brightness(.76) saturate(.78); }
}
@keyframes portal-opening {
  0%, 23% { --opening: 0px; }
  33% { --opening: 3cqw; }
  47% { --opening: 12cqw; }
  60% { --opening: 27cqw; }
  81%, 100% { --opening: 78cqw; }
}
@keyframes portal-charge {
  0%, 48%, 100% { opacity: 0; }
  24% { opacity: .95; }
  34% { opacity: .72; }
}
@keyframes portal-edge {
  0%, 18%, 100% { opacity: 0; }
  28%, 69% { opacity: .97; }
  84% { opacity: 0; }
}
@keyframes instrument-power {
  0%, 100% { box-shadow: none; }
  35% { box-shadow: 0 0 12px #ffc573aa; }
  76% { box-shadow: 0 0 13px #79e2e6a1; }
}
@media (prefers-reduced-motion: reduce) {
  .travel .view-past, .travel .portal, .travel .portal::before,
  .travel .portal::after, .travel .view-label { animation: none; }
}
fieldset { padding: 0; border: 0; margin: 16px auto 0; width: min(100%, 290px); }
legend {
  text-align: center;
  padding: 0 6px;
  font: 700 .73rem var(--type);
  text-transform: uppercase;
  letter-spacing: .16em;
  color: var(--muted);
}
.dials {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 5px;
  margin-top: 9px;
  padding: 8px;
  border: 1px solid #a18a61;
  border-radius: 8px;
  background: linear-gradient(#6e5839, #292219 18%, #241f16 80%, #776447);
  box-shadow: inset 0 0 0 2px #e8ca882b, 0 4px 7px #0008;
}
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid #ffeaab; outline-offset: 3px; }
.dial {
  --digit-height: 34px;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  height: calc(3 * var(--digit-height));
  padding: 0;
  border: 1px solid #14130f;
  border-radius: 4px;
  color: #f4e4b6;
  background: #1c1914;
  touch-action: none;
  user-select: none;
  cursor: grab;
}
.dial:active:not(:disabled) { cursor: grabbing; transform: none; }
.dial::before, .dial::after {
  position: absolute;
  z-index: 1;
  inset: 0;
  content: "";
  pointer-events: none;
}
.dial::before {
  background: linear-gradient(#0b0908ef, #0b090850 30%, transparent 43% 57%, #0b090855 70%, #0b0908f2);
}
.dial::after {
  inset-block: 33.333%;
  border-block: 1px solid #d9a65e6b;
  box-shadow: inset 0 0 7px #e4b46820;
}
.dial-digits {
  display: grid;
  background:
    linear-gradient(90deg, #12100df5, transparent 20% 80%, #110e0bea),
    repeating-linear-gradient(0deg, #7b6b57 0 1px, #3a3228 1px 4px);
}
.dial-digit {
  display: grid;
  place-items: center;
  height: var(--digit-height);
  font: 700 clamp(1.25rem, 6vw, 1.75rem) Georgia, serif;
  font-variant-numeric: lining-nums tabular-nums;
  text-shadow: 0 1px 2px #080704;
  background: linear-gradient(90deg, transparent 16%, #211c16 16% 84%, transparent 84%);
}
.controls > button, .note a {
  min-height: 48px;
  padding: 8px 14px;
  display: block;
  margin: 13px auto 0;
  border: 1px solid #ebc384;
  border-radius: 5px;
  background: linear-gradient(#dab477, #a97f42);
  color: #201708;
  font: 700 .9rem var(--type);
  box-shadow: inset 0 1px 0 #ffffd78c, 0 3px 5px #0009;
}
.note a {
  display: inline-flex;
  align-items: center;
  text-decoration: none;
}
.note a:focus-visible {
  outline: 2px solid #38260e;
  outline-offset: 3px;
}
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .58; cursor: wait; }
.status { text-align: center; margin: 13px auto 0; min-height: 2.5em; color: var(--signal); line-height: 1.25; }
.status:empty { min-height: 0; margin: 0; }
.note {
  width: min(100%, 345px);
  margin: 20px auto 0;
  padding: 15px 19px 18px;
  text-align: center;
  color: #2c2418;
  background: linear-gradient(130deg, #eee0b9, #d8c6a0);
  box-shadow: 0 4px 15px #0008;
}
.note h2 { font-size: 1.3rem; margin: 0; }
.note p { margin: 8px 0 0; font-size: 1.02rem; line-height: 1.3; }
</style>
</head>

</main>
<script>
const origin = '1940';
const yearInBrest = new Intl.DateTimeFormat('fr-FR', {
  timeZone: 'Europe/Paris',
  year: 'numeric',
});

const consolePanel = document.querySelector('.console');
const viewport = document.querySelector('.viewport');
const year = document.querySelector('.year');
const controls = document.querySelector('.controls');
const fieldset = document.querySelector('fieldset');
const dials = document.querySelector('.dials');
const status = document.querySelector('.status');
const note = document.querySelector('.note');
const arrival = note.querySelector('h2');
const start = document.getElementById('start');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

const digits = Array.from(origin, Number);
const dialButtons = [];
const dialTracks = [];
let traveling = false;

for (const index of digits.keys()) {
  const dial = document.createElement('button');
  dial.type = 'button';
  dial.className = 'dial';
  const track = document.createElement('span');
  track.className = 'dial-digits';
  track.setAttribute('aria-hidden', 'true');
  for (let row = 0; row < 3; row++) {
    const numeral = document.createElement('span');
    numeral.className = 'dial-digit';
    track.append(numeral);
  }
  dial.append(track);
  dials.append(dial);
  dialButtons.push(dial);
  dialTracks.push(track);
  showDigit(index);

  let pointerId = null;
  let lastY = 0;
  let dragged = false;
  dial.addEventListener('pointerdown', event => {
    if (event.button !== 0 || pointerId !== null) return;
    pointerId = event.pointerId;
    lastY = event.clientY;
    dragged = false;
    dial.setPointerCapture(pointerId);
  });
  dial.addEventListener('pointermove', event => {
    if (event.pointerId !== pointerId) return;
    const steps = Math.trunc((lastY - event.clientY) / 23);
    if (!steps) return;
    dragged = true;
    lastY -= steps * 23;
    adjust(index, steps);
  });
  dial.addEventListener('lostpointercapture', event => {
    if (event.pointerId === pointerId) pointerId = null;
  });
  dial.addEventListener('click', event => {
    if (event.detail === 0) {
      adjust(index, 1);
    } else if (!dragged) {
      const bounds = dial.getBoundingClientRect();
      adjust(index, event.clientY < bounds.top + bounds.height / 3 ? -1 : 1);
    }
  });
  dial.addEventListener('keydown', event => {
    if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
    event.preventDefault();
    adjust(index, event.key === 'ArrowUp' ? 1 : -1);
  });
}

function showDigit(index, direction = 0) {
  const digit = digits[index];
  const track = dialTracks[index];
  for (const [row, numeral] of Array.from(track.children).entries()) {
    numeral.textContent = (digit + row + 9) % 10;
  }
  dialButtons[index].setAttribute('aria-label', 'Molette ' + (index + 1) + ', chiffre ' + digit);
  for (const animation of track.getAnimations()) animation.cancel();
  if (direction && !reducedMotion.matches) {
    track.animate([
      { transform: 'translateY(' + Math.sign(direction) * 33.333 + '%)' },
      { transform: 'translateY(0)' },
    ], { duration: 135, easing: 'ease-out' });
  }
}

function adjust(index, change) {
  if (traveling) return;
  digits[index] = ((digits[index] + change) % 10 + 10) % 10;
  showDigit(index, change);
  status.textContent = 'Destination réglée sur ' + digits.join('') + '.';
}

function showYear(value) {
  year.textContent = value;
  const scene = value === origin ? 'reconstitution de juin 1940' : 'vue actuelle';
  viewport.setAttribute('aria-label', 'Parc à chaînes de Brest, ' + scene);
}

start.addEventListener('click', () => {
  if (traveling) return;
  const destination = yearInBrest.format(new Date());
  if (digits.join('') !== destination) {
    status.textContent = 'Pour revenir au présent, réglez les quatre molettes sur l’année en cours.';
    return;
  }

  traveling = true;
  start.disabled = true;
  fieldset.disabled = true;
  const duration = reducedMotion.matches ? 0 : 4500;
  consolePanel.style.setProperty('--travel-time', duration + 'ms');
  consolePanel.classList.add('travel');
  status.textContent = duration ? 'Mise sous tension…' : 'Passage en cours…';
  if (duration) {
    setTimeout(() => { status.textContent = 'Passage en cours…'; }, duration * .24);
    const yearSpan = Number(destination) - Number(origin);
    for (let step = 1; step < 12; step++) {
      setTimeout(() => {
        year.textContent = Number(origin) + Math.round(yearSpan * step / 12);
      }, duration * (.25 + step * .55 / 12));
    }
    setTimeout(() => { showYear(destination); }, duration * .8);
  }

  setTimeout(() => {
    showYear(destination);
    consolePanel.classList.replace('travel', 'arrived');
    controls.hidden = true;
    status.hidden = true;
    note.hidden = false;
    arrival.focus();
    traveling = false;
  }, duration);
});

</script>
</body>
</html>
